<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Plagiarism</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="dashboard.html">
            Plagiarism Detection System
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="upload.html">
                        Check Plagiarism
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-2">
                        Check Plagiarism
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Enter your document details and text
                    </p>


                    <div class="mb-4">

                        <label
                            for="documentName"
                            class="form-label fw-bold"
                        >
                            Document Name
                        </label>

                        <input
                            type="text"
                            id="documentName"
                            class="form-control"
                            placeholder="Enter document name"
                        >

                    </div>


                    <div class="mb-4">

                        <label
                            for="textInput"
                            class="form-label fw-bold"
                        >
                            Document Text
                        </label>

                        <textarea
                            id="textInput"
                            class="form-control"
                            rows="12"
                            placeholder="Paste your document text here..."
                        ></textarea>

                    </div>


                    <div class="d-grid">

                        <button
                            id="checkButton"
                            class="btn btn-primary btn-lg"
                        >
                            Check Plagiarism
                        </button>

                    </div>


                    <div
                        id="loadingMessage"
                        class="text-center mt-4"
                        style="display:none;"
                    >

                        <div
                            class="spinner-border text-primary"
                            role="status"
                        ></div>

                        <p class="mt-2">
                            Checking plagiarism...
                        </p>

                    </div>


                    <div
                        id="errorMessage"
                        class="alert alert-danger mt-4"
                        style="display:none;"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:8080/api";

const checkButton =
    document.getElementById("checkButton");

const loadingMessage =
    document.getElementById("loadingMessage");

const errorMessage =
    document.getElementById("errorMessage");


checkButton.addEventListener("click", async function () {

    const documentName =
        document.getElementById("documentName")
            .value
            .trim();

    const text =
        document.getElementById("textInput")
            .value
            .trim();


    errorMessage.style.display = "none";
    errorMessage.textContent = "";


    if (documentName === "") {

        errorMessage.textContent =
            "Please enter the document name.";

        errorMessage.style.display = "block";

        return;
    }


    if (text === "") {

        errorMessage.textContent =
            "Please paste the document text.";

        errorMessage.style.display = "block";

        return;
    }


    loadingMessage.style.display = "block";

    checkButton.disabled = true;

    checkButton.textContent = "Checking...";


    try {

        const formData =
            new URLSearchParams();

        formData.append(
            "documentName",
            documentName
        );

        formData.append(
            "text",
            text
        );


        const response =
            await fetch(
                API_URL + "/plagiarism/check",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: formData.toString()
                }
            );


        if (!response.ok) {

            throw new Error(
                "Backend request failed"
            );

        }


        const result =
            await response.json();


        console.log(
            "Java Backend Result:",
            result
        );


        /*
         * IMPORTANT:
         * Save the actual Java backend result.
         */

        localStorage.setItem(
            "latestPlagiarismResult",
            JSON.stringify(result)
        );


        /*
         * Open result page
         */

        window.location.href =
            "result.html";


    } catch (error) {

        console.error(error);

        errorMessage.textContent =
            "Unable to connect to Java backend. Make sure Spring Boot is running on port 8080.";

        errorMessage.style.display =
            "block";

    } finally {

        loadingMessage.style.display =
            "none";

        checkButton.disabled =
            false;

        checkButton.textContent =
            "Check Plagiarism";

    }

});

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
